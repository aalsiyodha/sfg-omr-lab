<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="description" content="SFG OMR LAB v2.4.618 — local scanning and universal multi-model comparison." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme before React paints to avoid a light-mode flash.
      try {
        const saved = localStorage.getItem('sfg-omr-theme');
        const theme = saved === 'dark' || saved === 'light'
          ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        document.documentElement.setAttribute('data-theme', theme);
      } catch { /* Theme defaults to the light stylesheet */ }
    </script>
    <title>SFG OMR LAB — v2.4.618 Fast Scanner</title>
    <script>
      // OpenCV.js loading state
      window.opencvReady = false;
      window.opencvError = null;
    </script>
    <script>
      // Experimental runtime selection. Only this branch offers the alternate.
      // Reload the whole page to switch runtimes; never load two cv builds together.
      (function () {
        const params = new URLSearchParams(window.location.search);
        const experimental = params.get('cvEngine') === 'ttop32-4.12';
        const url = experimental
          ? 'https://cdn.jsdelivr.net/npm/opencv-js-wasm@4.12.0/opencv.js'
          : 'https://docs.opencv.org/4.8.0/opencv.js';
        window.omrCvEngine = experimental ? 'ttop32-4.12' : 'official-4.8';
        window.omrCvSource = url;
        window.omrCvInitMs = null;
        const started = performance.now();
        let settled = false;
        const fail = (reason) => {
          if (settled) return;
          settled = true;
          clearInterval(poller);
          clearTimeout(watchdog);
          window.opencvError = reason;
          window.dispatchEvent(new Event('opencv-error'));
        };
        const probe = () => {
          if (settled) return;
          let cv = window.cv;
          // OpenCV.js builds can yield a Module object, a cv object, or a Promise.
          if ((!cv || typeof cv.Mat !== 'function') &&
              window.Module && typeof window.Module.Mat === 'function') {
            cv = window.Module;
            window.cv = cv;
          }
          if (!cv || typeof cv.Mat !== 'function') return;
          try {
            const mat = new cv.Mat(1, 1, cv.CV_8UC1);
            mat.delete();
          } catch (_) { return; }
          settled = true;
          clearInterval(poller);
          clearTimeout(watchdog);
          window.omrCvInitMs = Math.round(performance.now() - started);
          window.opencvReady = true;
          window.dispatchEvent(new Event('opencv-ready'));
        };
        // Set up before script injection so synchronous callbacks are captured.
        window.Module = {
          onRuntimeInitialized: probe,
          onAbort: (reason) => fail('OpenCV WASM aborted: ' + String(reason))
        };
        const poller = setInterval(probe, 80);
        const watchdog = setTimeout(
          () => fail('OpenCV runtime did not initialize within 45 seconds'), 45000
        );
        const script = document.createElement('script');
        script.async = true;
        script.src = url;
        script.onload = () => {
          const candidate = window.cv;
          if (candidate && typeof candidate.then === 'function') {
            candidate.then((instance) => {
              if (instance && typeof instance.Mat === 'function') window.cv = instance;
              probe();
            }).catch(err => fail('OpenCV Promise rejected: ' + String(err)));
          }
          probe();
        };
        script.onerror = () => fail('Could not download OpenCV runtime: ' + url);
        document.head.appendChild(script);
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
