<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="SFG OMR Lab — scan answer sheets in your browser. Verify QR identity, review marked answers and score practice tests." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.setAttribute('data-bs-theme', 'light');
    </script>
    <title>SFG OMR Lab — Scan and Review Answer Sheets</title>
    <script>
      // OpenCV.js loading state
      window.opencvReady = false;
      window.opencvError = null;
    </script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js"
      onload="window.opencvReady = true; window.dispatchEvent(new Event('opencv-ready'));"
      onerror="window.opencvError = 'Failed to load OpenCV.js'; window.dispatchEvent(new Event('opencv-error'));">
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
