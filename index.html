<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="description" content="SFG OMR LAB v2.4.5 — local scanning and universal multi-model comparison." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme before React paints to avoid a light-mode flash.
      try {
        const saved = localStorage.getItem('sfg-omr-theme');
        const theme = saved === 'dark' || saved === 'light'
          ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        document.documentElement.setAttribute('data-theme', theme);
      } catch { /* Theme defaults to the light stylesheet */ }
    </script>
    <title>SFG OMR LAB — v2.4.5 Fast Scanner</title>
    <script>
      // OpenCV.js loading state
      window.opencvReady = false;
      window.opencvError = null;
    </script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js"
      onload="window.opencvReady = true; window.dispatchEvent(new Event('opencv-ready'));"
      onerror="window.opencvError = 'Failed to load OpenCV.js'; window.dispatchEvent(new Event('opencv-error'));">
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
