<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="SFG OMR Lab — scan answer sheets in your browser. Verify QR identity, review marked answers and score practice tests." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme before React paints to avoid a light-mode flash.
      try {
        const saved = localStorage.getItem('sfg-omr-theme');
        const theme = saved === 'dark' || saved === 'light'
          ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
        document.documentElement.setAttribute('data-theme', theme);
      } catch { /* Theme defaults to the light stylesheet */ }
    </script>
    <title>SFG OMR Lab — Scan and Review Answer Sheets</title>
    <script>
      // Self-hosted, version-pinned OpenCV 4.8. Avoid conflicting runtime instances
      // and never signal ready merely because the JS file finished downloading.
      window.opencvReady = false;
      window.opencvError = null;
      (() => {
        const asset = '%BASE_URL%opencv/opencv.js';
        let settled = false;
        let thenAttached = false;
        let lastError = '';
        const started = Date.now();
        const timeoutMs = 45000;
        const ready = (runtime) => {
          if (settled || !runtime || typeof runtime.Mat !== 'function') return false;
          try {
            const probe = new runtime.Mat();
            probe.delete();
          } catch (e) {
            lastError = String(e);
            return false;
          }
          settled = true;
          window.cv = runtime;
          window.opencvReady = true;
          clearInterval(probeTimer);
          window.dispatchEvent(new Event('opencv-ready'));
          return true;
        };
        const fail = (reason) => {
          if (settled) return;
          settled = true;
          window.opencvError = reason;
          clearInterval(probeTimer);
          window.dispatchEvent(new Event('opencv-error'));
        };
        const inspect = () => {
          if (settled) return;
          if (ready(window.cv)) return;
          const runtime = window.cv;
          if (runtime && typeof runtime.then === 'function' && !thenAttached) {
            thenAttached = true;
            try {
              // OpenCV's custom thenable must not be wrapped in Promise.resolve().
              runtime.then((resolved) => {
                if (!ready(resolved)) ready(window.cv);
              }, (e) => {
                lastError = 'OpenCV WASM initialization rejected: ' + String(e);
                fail(lastError);
              });
            } catch (e) {
              lastError = String(e);
              fail('OpenCV initialization error: ' + lastError);
            }
          } else if (runtime && !thenAttached && typeof runtime.onRuntimeInitialized !== 'function') {
            runtime.onRuntimeInitialized = () => { ready(window.cv); };
          }
          if (!settled && Date.now() - started >= timeoutMs) {
            fail('OpenCV runtime did not initialize within 45 seconds. ' +
              (lastError ? lastError : 'Try a fresh reload or another browser.'));
          }
        };
        const probeTimer = window.setInterval(inspect, 150);
        const script = document.createElement('script');
        script.src = asset;
        script.async = true;
        script.onload = inspect;
        script.onerror = () => fail('The self-hosted OpenCV runtime could not load: ' + asset);
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
