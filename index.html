<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#111c36" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
