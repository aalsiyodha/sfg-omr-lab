name: Deploy SIMD Geometry Lab + preserve baselines
on:
  push:
    branches:
      - experiment/v2.5.3-simd-geometry-lab
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: simd-geometry-pages-v1
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2.2-sheetid-timing-prototype
          path: sheetid
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2.5.3-accuracy-speed
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2.5.3-simd-geometry-lab
          path: geometry
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            sheetid/package-lock.json
            baseline/package-lock.json
            geometry/package-lock.json
      - name: Build original stable scanner
        working-directory: production
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true npm run build
      - name: Build preserved SheetID prototype
        working-directory: sheetid
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/sheetid-test/' npm run build
      - name: Build untouched v2.5.3 baseline
        working-directory: baseline
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/opt-lab/' npm run build
      - name: Test and build experimental geometry scanner
        working-directory: geometry
        run: |
          npm ci
          npm run typecheck
          npm run test:scanner
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/simd-lab/' npm run build
      - name: Package four independently versioned deployments
        run: |
          mkdir -p production/dist/{sheetid-test,opt-lab,simd-lab}
          cp -a sheetid/dist/. production/dist/sheetid-test/
          cp -a baseline/dist/. production/dist/opt-lab/
          cp -a geometry/dist/. production/dist/simd-lab/
          test -f production/dist/index.html
          test -f production/dist/sheetid-test/index.html
          test -f production/dist/opt-lab/index.html
          test -f production/dist/simd-lab/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist
  deploy:
    environment:
      name: simd-geometry-pages
      url: https://aalsiyodha.github.io/sfg-omr-lab/simd-lab/#/scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
