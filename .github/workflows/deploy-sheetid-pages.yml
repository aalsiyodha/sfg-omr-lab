name: Deploy isolated Sheet ID experiment alongside unchanged main app
on:
  push:
    branches:
      - experiment/v2.2-sheetid-timing-prototype
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Rebuild the unchanged main source as the site root. Never deploy an
      # experimental index.html over the existing /sfg-omr-lab/ scanner.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2.2-sheetid-timing-prototype
          path: sheetid
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            sheetid/package-lock.json
      - name: Build unchanged original scanner at root
        working-directory: production
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true npm run build
      - name: Test and build Sheet ID prototype in subdirectory
        working-directory: sheetid
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE: '/sfg-omr-lab/sheetid-test/'
        run: |
          npm ci
          npm run typecheck
          npm run test:scanner
          npm run build
      - name: Combine both sites without replacing original scanner
        run: |
          mkdir -p production/dist/sheetid-test
          cp -a sheetid/dist/. production/dist/sheetid-test/
          test -f production/dist/index.html
          test -f production/dist/sheetid-test/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist
  deploy:
    environment:
      name: github-pages
      url: https://aalsiyodha.github.io/sfg-omr-lab/sheetid-test/#/sheetid
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
