name: Deploy v2.5.3 A/B experiment alongside original and Sheet ID
on:
  push:
    branches:
      - experiment/v2.5.3-accuracy-speed
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: opt-lab-pages-v1
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2.2-sheetid-timing-prototype
          path: sheetid
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2.5.3-accuracy-speed
          path: optlab
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            sheetid/package-lock.json
            optlab/package-lock.json
      - name: Build original main at original root
        working-directory: production
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true npm run build
      - name: Preserve frozen Sheet ID test path
        working-directory: sheetid
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/sheetid-test/' npm run build
      - name: Test optimized scanner and build isolated URL
        working-directory: optlab
        run: |
          npm ci
          npm run typecheck
          npm run test:scanner
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/opt-lab/' npm run build
      - name: Combine three independent static apps
        run: |
          mkdir -p production/dist/sheetid-test production/dist/opt-lab
          cp -a sheetid/dist/. production/dist/sheetid-test/
          cp -a optlab/dist/. production/dist/opt-lab/
          test -f production/dist/index.html
          test -f production/dist/sheetid-test/index.html
          test -f production/dist/opt-lab/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist
  deploy:
    environment:
      name: opt-lab-pages
      url: https://aalsiyodha.github.io/sfg-omr-lab/opt-lab/#/scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
