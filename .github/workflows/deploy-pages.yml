name: Deploy SFG OMR Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run scanner regression tests
        run: npm run test:scanner
      - name: Build website
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # Build the experimental branch separately. The original dist/ root
      # remains the v2.3.45 production website at its existing URL.
      - name: Check out v2.3.46 experiment
        uses: actions/checkout@v4
        with:
          ref: experiment/v2.3.46-qr-aruco-recovery
          path: experiment-source
      - name: Install experimental dependencies
        run: npm ci
        working-directory: experiment-source
      - name: Test experimental scanner
        run: npm run test:scanner
        working-directory: experiment-source
      - name: Build experimental website
        run: npm run build
        working-directory: experiment-source
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE: '/sfg-omr-lab/v2.3.46/'
      - name: Package both versions
        run: |
          mkdir -p dist/v2.3.46
          cp -R experiment-source/dist/. dist/v2.3.46/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
