name: SFG OMR Lab — Public Production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test:scanner
      - name: Pin and verify same-origin OpenCV.js
        run: |
          mkdir -p public/opencv
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            https://docs.opencv.org/4.8.0/opencv.js -o public/opencv/opencv.js
          test "$(wc -c < public/opencv/opencv.js)" -gt 1000000
          grep -q 'Mat' public/opencv/opencv.js
      - name: Build the public scanner
        run: GITHUB_PAGES=true npm run build
      - name: Include the document-boundary recovery assets
        run: |
          mkdir -p dist/ai-model/scanic
          cp -a node_modules/scanic-ml/dist/. dist/ai-model/scanic/
          test -s dist/index.html
          test -s dist/opencv/opencv.js
          test ! -d dist/rescue-lab
          test ! -d dist/cv-bench
          test ! -d dist/opt-lab
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: v26-production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
