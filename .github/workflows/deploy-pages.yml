name: Deploy SFG OMR Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run scanner regression tests
        run: npm run test:scanner
      - name: Build website
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # Preserve the original v2.3.45 scanner on a dedicated subpath.
      # Its archived source and build remain independent of current main.
      - name: Check out archived v2.3.45
        uses: actions/checkout@v4
        with:
          ref: archive/v2.3.45-stable
          path: archived-source
      - name: Install archived dependencies
        run: npm ci
        working-directory: archived-source
      - name: Test archived scanner
        run: npm run test:scanner
        working-directory: archived-source
      - name: Set archived Pages base path
        working-directory: archived-source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vite.config.ts')
          text=p.read_text()
          needle="'/sfg-omr-lab/'"
          assert needle in text
          p.write_text(text.replace(needle,"'/sfg-omr-lab/v2.3.45/'",1))
          PY
      - name: Build archived v2.3.45 website
        run: npm run build
        working-directory: archived-source
        env:
          GITHUB_PAGES: 'true'
      - name: Package both versions
        run: |
          mkdir -p dist/v2.3.45
          cp -R archived-source/dist/. dist/v2.3.45/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
