name: CV Runtime Benchmark — preserve baselines and publish v2.5.5
on:
  push:
    branches:
      - experiment/v2.5.5-cv-runtime-bench
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cv-runtime-bench-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2.2-sheetid-timing-prototype
          path: sheetid
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2.5.3-accuracy-speed
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2.5.3-simd-geometry-lab
          path: geometry
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2.5.4-partial-geometry-rescue
          path: rescue
      - uses: actions/checkout@v4
        with:
          ref: experiment/v2.5.5-cv-runtime-bench
          path: benchmark
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            sheetid/package-lock.json
            baseline/package-lock.json
            geometry/package-lock.json
            rescue/package-lock.json
            benchmark/package-lock.json
      - name: Build production baseline
        working-directory: production
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true npm run build
      - name: Build SheetID reference
        working-directory: sheetid
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/sheetid-test/' npm run build
      - name: Build v2.5.3 ROI reference
        working-directory: baseline
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/opt-lab/' npm run build
      - name: Build v2.5.3 geometry reference
        working-directory: geometry
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/simd-lab/' npm run build
      - name: Build v2.5.4 rescue reference
        working-directory: rescue
        run: |
          npm ci
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/rescue-lab/' npm run build
      - name: Resolve ttop32 package and run all scanner checks
        working-directory: benchmark
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          npm run typecheck
          npm run test:scanner
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/cv-bench/' npm run build
          test -s node_modules/opencv-js-wasm/opencv.js
          test -d node_modules/scanic-ml/dist
      - name: Commit locked fork dependency for reproducible clone
        working-directory: benchmark
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m "chore(cv-bench): resolve pinned ttop32 OpenCV WASM dependency"
            git push origin HEAD:experiment/v2.5.5-cv-runtime-bench
          fi
      - name: Package separately versioned Pages environments
        run: |
          mkdir -p production/dist/{sheetid-test,opt-lab,simd-lab,rescue-lab,cv-bench,downloads}
          cp -a sheetid/dist/. production/dist/sheetid-test/
          cp -a baseline/dist/. production/dist/opt-lab/
          cp -a geometry/dist/. production/dist/simd-lab/
          cp -a rescue/dist/. production/dist/rescue-lab/
          cp -a benchmark/dist/. production/dist/cv-bench/
          mkdir -p production/dist/rescue-lab/ai-model/scanic production/dist/cv-bench/ai-model/scanic
          cp -a rescue/node_modules/scanic-ml/dist/. production/dist/rescue-lab/ai-model/scanic/
          cp -a benchmark/node_modules/scanic-ml/dist/. production/dist/cv-bench/ai-model/scanic/
          mkdir -p production/dist/cv-bench/cv-engines/ttop32
          cp benchmark/node_modules/opencv-js-wasm/opencv.js production/dist/cv-bench/cv-engines/ttop32/opencv.js
          test -s production/dist/cv-bench/cv-engines/ttop32/opencv.js
          test -f production/dist/cv-bench/index.html
      - name: Create minimal source ZIP
        run: |
          mkdir -p trimmed-source
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='dist' \
            --exclude='*.pdf' --exclude='.env*' --exclude='coverage' benchmark/ trimmed-source/
          cat > trimmed-source/CV-BENCH-README.txt <<'EOF'
          SFG OMR LAB v2.5.5 CV Runtime Benchmark
          npm ci; npm run check; npm run dev
          For local dev: copy node_modules/opencv-js-wasm/opencv.js to
            public/cv-engines/ttop32/opencv.js
          For hosted build: workflow packages that embedded-WASM asset
            under /cv-bench/cv-engines/ttop32/.
          The ttop32 runtime is sandboxed and never replaces the verified scorer.
          Production main, original ROI and rescue lab are preserved.
          EOF
          (cd trimmed-source && zip -q -r ../sfg-omr-v2.5.5-cv-bench-trimmed.zip .)
          cp sfg-omr-v2.5.5-cv-bench-trimmed.zip production/dist/downloads/
          unzip -tq sfg-omr-v2.5.5-cv-bench-trimmed.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sfg-omr-v2.5.5-cv-bench-source
          path: sfg-omr-v2.5.5-cv-bench-trimmed.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: cv-runtime-benchmark
      url: https://aalsiyodha.github.io/sfg-omr-lab/cv-bench/#/scan
    steps:
      - uses: actions/deploy-pages@v4
