name: Scanner reliability checks
on:
  push:
    branches: [test-build, hybrid-experiment, omr-v2-experiment, omr-v2-aruco-gray-experiment]
  pull_request:
    branches: [test-build, main]

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:scanner
