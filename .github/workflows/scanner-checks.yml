name: Code quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [test-build, hybrid-experiment, omr-v2-experiment, omr-v2-aruco-gray-experiment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, lint, regression tests, production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run full validation gate
        run: npm run check
