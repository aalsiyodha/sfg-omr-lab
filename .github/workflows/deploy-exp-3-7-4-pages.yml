name: Deploy isolated classical CV only Experiment 3.7.4
on:
  push:
    branches:
      - experiment/3-7-4-classical-only
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Checkout isolated experiment
        uses: actions/checkout@v4
        with:
          ref: experiment/3-7-4-classical-only
          path: experiment
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            experiment/package-lock.json
      - name: Validate and build stable root
        working-directory: production
        run: |
          npm ci
          npm run typecheck
          npm run test:scanner
          mkdir -p public/opencv
          archive=$(npm pack --silent @techstark/opencv-js@4.8.0-release.10)
          tar -xzf "$archive" package/dist/opencv.js
          cp package/dist/opencv.js public/opencv/opencv.js
          rm -rf package "$archive"
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true npm run build
          mkdir -p dist/ai-model/scanic
          cp -a node_modules/scanic-ml/dist/. dist/ai-model/scanic/
      - name: Validate and build classical CV only experiment
        working-directory: experiment
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test:scanner
          mkdir -p public/opencv
          archive=$(npm pack --silent @techstark/opencv-js@4.8.0-release.10)
          tar -xzf "$archive" package/dist/opencv.js
          cp package/dist/opencv.js public/opencv/opencv.js
          rm -rf package "$archive"
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/experiments/3.7.4/' npm run build
          mkdir -p dist/ai-model/scanic
          cp -a node_modules/scanic-ml/dist/. dist/ai-model/scanic/
      - name: Combine stable root and isolated experiment
        run: |
          mkdir -p production/dist/experiments/3.7.4
          cp -a experiment/dist/. production/dist/experiments/3.7.4/
          test -s production/dist/index.html
          test -s production/dist/experiments/3.7.4/index.html
          test -s production/dist/experiments/3.7.4/opencv/opencv.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: exp-3-7-3
      url: https://aalsiyodha.github.io/sfg-omr-lab/experiments/3.7.4/#/experiment-3-7-3
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
