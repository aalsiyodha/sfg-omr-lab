name: Next.js migration checks

on:
  push:
    branches:
      - experiment/nextjs-multitenant-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nextjs-shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Next.js shell dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check shell
        run: npm run typecheck
      - name: Build Next.js shell
        run: npm run build
