name: Deploy historical full v2.3.3 ten-photo benchmark
on:
  push:
    branches:
      - experiment/legacy-full-v233-ten-photo-benchmark
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Checkout isolated experiment
        uses: actions/checkout@v4
        with:
          ref: experiment/legacy-full-v233-ten-photo-benchmark
          path: experiment
      - name: Checkout frozen classical baseline 3.7.4
        uses: actions/checkout@v4
        with:
          ref: experiment/3-7-4-classical-only
          path: baseline
      - name: Checkout classical 3.7.6 comparison
        uses: actions/checkout@v4
        with:
          ref: experiment/3-7-6-color-paper-geometry
          path: comparison
      - name: Checkout isolated Classical CV + Local AI Rescue 3.7.10
        uses: actions/checkout@v4
        with:
          ref: experiment/3-7-10-classical-local-ai-forensics
          path: classical-ai-3710
      - name: Checkout adaptive dual AI experiment 3.7.11
        uses: actions/checkout@v4
        with:
          ref: experiment/3-7-11-adaptive-dual-ai-consistency
          path: adaptive-dual-3711
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            experiment/package-lock.json
            baseline/package-lock.json
            comparison/package-lock.json
            classical-ai-3710/package-lock.json
            adaptive-dual-3711/package-lock.json
      - name: Validate and build stable root
        working-directory: production
        run: |
          npm ci
          npm run typecheck
          npm run test:scanner
          mkdir -p public/opencv
          archive=$(npm pack --silent @techstark/opencv-js@4.8.0-release.10)
          tar -xzf "$archive" package/dist/opencv.js
          cp package/dist/opencv.js public/opencv/opencv.js
          rm -rf package "$archive"
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true npm run build
          mkdir -p dist/ai-model/scanic
          cp -a node_modules/scanic-ml/dist/. dist/ai-model/scanic/
      - name: Validate and build historical full v2.3.3
        working-directory: experiment
        run: |
          npm ci
          npm run lint
          npm run test:scanner
          mkdir -p public/opencv
          archive=$(npm pack --silent @techstark/opencv-js@4.8.0-release.10)
          tar -xzf "$archive" package/dist/opencv.js
          cp package/dist/opencv.js public/opencv/opencv.js
          rm -rf package "$archive"
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/experiments/legacy-full-v233/' npm run build
      - name: Restore baseline 3.7.4 and comparison 3.7.6 pages
        run: |
          for label in baseline comparison; do
            cd "$GITHUB_WORKSPACE/$label"
            npm ci
            npm run typecheck
            npm run test:scanner
            mkdir -p public/opencv
            archive=$(npm pack --silent @techstark/opencv-js@4.8.0-release.10)
            tar -xzf "$archive" package/dist/opencv.js
            cp package/dist/opencv.js public/opencv/opencv.js
            rm -rf package "$archive"
            version="3.7.4"
            if [ "$label" = "comparison" ]; then version="3.7.6"; fi
            GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE="/sfg-omr-lab/experiments/$version/" npm run build
            mkdir -p dist/ai-model/scanic
            cp -a node_modules/scanic-ml/dist/. dist/ai-model/scanic/
            mkdir -p "$GITHUB_WORKSPACE/production/dist/experiments/$version"
            cp -a dist/. "$GITHUB_WORKSPACE/production/dist/experiments/$version/"
          done
      - name: Validate and build Classical CV + Local AI Rescue 3.7.10
        working-directory: classical-ai-3710
        run: |
          npm ci
          npm run typecheck
          npm run test:scanner
          mkdir -p public/opencv
          archive=$(npm pack --silent @techstark/opencv-js@4.8.0-release.10)
          tar -xzf "$archive" package/dist/opencv.js
          cp package/dist/opencv.js public/opencv/opencv.js
          rm -rf package "$archive"
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/experiments/3.7.10/' npm run build
          mkdir -p dist/ai-model/scanic
          cp -a node_modules/scanic-ml/dist/. dist/ai-model/scanic/
          mkdir -p "$GITHUB_WORKSPACE/production/dist/experiments/3.7.10"
          cp -a dist/. "$GITHUB_WORKSPACE/production/dist/experiments/3.7.10/"
      - name: Validate and build 3.7.11 Adaptive CV + Dual AI + Bubble Consistency
        working-directory: adaptive-dual-3711
        run: |
          npm ci
          npm run typecheck
          npm run test:scanner
          mkdir -p public/opencv public/ai-runtime public/ai-model
          archive=$(npm pack --silent @techstark/opencv-js@4.8.0-release.10)
          tar -xzf "$archive" package/dist/opencv.js
          cp package/dist/opencv.js public/opencv/opencv.js
          rm -rf package "$archive"
          # Independently packaged DocAligner LCNet + quadscan browser runtime.
          archive=$(npm pack --silent --ignore-scripts quadscan@1.0.0)
          tar -xzf "$archive"
          cp package/dist/quadscan.iife.js public/ai-runtime/quadscan.iife.js
          cp package/models/lcnet100_h_e_bifpn_256_fp32.onnx public/ai-model/
          rm -rf package "$archive"
          archive=$(npm pack --silent --ignore-scripts onnxruntime-web@1.20.1)
          tar -xzf "$archive"
          cp package/dist/*.wasm public/ai-runtime/
          rm -rf package "$archive"
          # Optional heavier DocAligner FastViT-T8: official published model.
          # If Google Drive declines the download, LCNet remains the guaranteed
          # second, independent AI; the FastViT probe fails closed.
          python -m pip install --quiet gdown
          gdown --quiet --id 1W88oOkHjMza6xXbDxrG8k_C-Tf2aYKJ4 \
            --output public/ai-model/fastvit_t8_h_e_bifpn_256_fp32.onnx || true
          if test -f public/ai-model/fastvit_t8_h_e_bifpn_256_fp32.onnx; then
            bytes=$(wc -c < public/ai-model/fastvit_t8_h_e_bifpn_256_fp32.onnx)
            if test "$bytes" -lt 5000000; then
              rm -f public/ai-model/fastvit_t8_h_e_bifpn_256_fp32.onnx
              echo "FastViT download invalid; retaining packaged LCNet secondary model"
            fi
          fi
          GITHUB_SHA="$(git rev-parse HEAD)" GITHUB_PAGES=true GITHUB_PAGES_BASE='/sfg-omr-lab/experiments/3.7.11/' npm run build
          mkdir -p dist/ai-model/scanic
          cp -a node_modules/scanic-ml/dist/. dist/ai-model/scanic/
          mkdir -p "$GITHUB_WORKSPACE/production/dist/experiments/3.7.11"
          cp -a dist/. "$GITHUB_WORKSPACE/production/dist/experiments/3.7.11/"
      - name: Combine stable root and isolated experiment
        run: |
          mkdir -p production/dist/experiments/legacy-full-v233
          cp -a experiment/dist/. production/dist/experiments/legacy-full-v233/
          test -s production/dist/index.html
          test -s production/dist/experiments/legacy-full-v233/index.html
          test -s production/dist/experiments/legacy-full-v233/opencv/opencv.js
          test -s production/dist/experiments/3.7.4/index.html
          test -s production/dist/experiments/3.7.6/index.html
          test -s production/dist/experiments/3.7.10/index.html
          test -s production/dist/experiments/3.7.10/opencv/opencv.js
          test -d production/dist/experiments/3.7.10/ai-model/scanic
          test -s production/dist/experiments/3.7.11/index.html
          test -s production/dist/experiments/3.7.11/opencv/opencv.js
          test -s production/dist/experiments/3.7.11/ai-runtime/quadscan.iife.js
          test -s production/dist/experiments/3.7.11/ai-model/lcnet100_h_e_bifpn_256_fp32.onnx
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: legacy-full-v233
      url: https://aalsiyodha.github.io/sfg-omr-lab/experiments/legacy-full-v233/#/legacy-full-batch
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
